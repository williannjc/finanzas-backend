name: Test backend

on:
  push:
    branches:
      - feature/transfers
      - main
  pull_request:
    branches:
      - feature/transfers
      - main
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run backend tests
        env:
          # Valores ficticios: las pruebas deben usar mocks, nunca datos reales.
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key-not-valid
          SUPABASE_ANON_KEY: test-anon-key-not-valid
        run: npm test

  transfer-database-idempotency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finanzas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finanzas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run isolated PostgreSQL idempotency test
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d finanzas_test -v ON_ERROR_STOP=1 -f scripts/test-transfer-idempotency.sql
