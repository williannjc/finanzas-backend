name: Test backend

on:
  push:
    branches:
      - feature/transfers
  pull_request:
    branches:
      - feature/transfers

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          # Valores ficticios: las pruebas deben usar mocks, nunca datos reales.
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key-not-valid
          SUPABASE_ANON_KEY: test-anon-key-not-valid
        run: npm test
